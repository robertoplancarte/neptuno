description: Ruby 4.0 and a new Rails 8.1 app on PostgreSQL, generated with rails new
port: 3000
services: [postgres, valkey, s3]
# Installed gems live in a named volume, so they survive container rebuilds
# and only change when Gemfile.lock does.
volumes: ["{{.Name}}_bundle:/usr/local/bundle"]
# The marker tells entrypoint.sh this is a new app; rails new goes last, as
# options append their flags to it.
generate: >-
  mkdir -p tmp && touch tmp/neptuno-new-app &&
  gem install rails -v '~> 8.1' --no-document &&
  rails new . --name={{.Name}} --database=postgresql
  --skip-git --skip-docker --skip-kamal --skip-thruster

# Choices `neptuno add --stack rails` offers. Rails 8.1 already sets up Solid
# Queue, Solid Cache, Solid Cable and Active Storage on local disk.
options:
  mailpit:
    description: Action Mailer delivers to the project's Mailpit in development
    default: true
    services: [mailpit]
    after_generate: |-
      sed -i -e 's|default_url_options = { host: "localhost", port: 3000 }|default_url_options = { host: "{{.Name}}.localhost" }|' -e '/config.action_mailer.default_url_options/a\
      \
        # Deliver over SMTP to Mailpit, which keeps every mail and shows it at\
        # http://mailpit.localhost. Compose gives the repo SMTP_HOST and SMTP_PORT.\
        config.action_mailer.delivery_method = :smtp\
        config.action_mailer.smtp_settings = { address: ENV.fetch("SMTP_HOST", "localhost"), port: ENV.fetch("SMTP_PORT", "1025").to_i }' config/environments/development.rb &&
      grep -q "delivery_method = :smtp" config/environments/development.rb
  tailwind:
    description: Tailwind CSS, rebuilt by a css process
    default: true
    generate_flags: --css=tailwind
    procfile: ["css: bin/rails tailwindcss:watch"]
  action_text:
    description: Action Text rich text editing (Trix)
    after_generate: bin/rails action_text:install
  storage_s3:
    description: Active Storage on the project's SeaweedFS (S3) instead of local disk
    services: [s3]
    env:
      - AWS_ENDPOINT=http://s3:8333
      - AWS_ACCESS_KEY_ID=neptuno
      - AWS_SECRET_ACCESS_KEY=neptuno
      - S3_BUCKET={{.Name}}-development
    after_generate: |-
      bundle add aws-sdk-s3 --require=false &&
      printf '%s\n' '' 'seaweedfs:' '  service: S3' '  endpoint: <%= ENV["AWS_ENDPOINT"] %>' '  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>' '  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>' '  region: us-east-1' '  bucket: <%= ENV["S3_BUCKET"] %>' '  force_path_style: true' >> config/storage.yml &&
      sed -i 's/config.active_storage.service = :local/config.active_storage.service = :seaweedfs/' config/environments/development.rb
