description: Ruby 4.0 and a new Rails 8.1 app on PostgreSQL, generated with rails new
port: 3000
services: [postgres, valkey, s3]
# Installed gems live in a named volume, so they survive container rebuilds
# and only change when Gemfile.lock does.
volumes: ["{{.Name}}_bundle:/usr/local/bundle"]
# The marker tells entrypoint.sh this is a new app; rails new goes last, as
# options append their flags to it. --skip-git leaves git init to Neptuno, but
# it also skips .gitignore and .gitattributes, so those come from app/.
generate: >-
  mkdir -p tmp && touch tmp/neptuno-new-app &&
  gem install rails -v '~> 8.1' --no-document &&
  rails new . --name={{.Name}} --database=postgresql
  --skip-git --skip-docker --skip-kamal --skip-thruster

# Choices `neptuno add --stack rails` offers. Rails 8.1 already sets up Solid
# Queue, Solid Cache, Solid Cable and Active Storage on local disk.
options:
  mailpit:
    description: Action Mailer delivers to the project's Mailpit in development
    default: true
    services: [mailpit]
    after_generate: |-
      sed -i -e 's|default_url_options = { host: "localhost", port: 3000 }|default_url_options = { host: "{{.Name}}.localhost" }|' -e '/config.action_mailer.default_url_options/a\
      \
        # Deliver over SMTP to Mailpit, which keeps every mail and shows it at\
        # http://mailpit.localhost. Compose gives the repo SMTP_HOST and SMTP_PORT.\
        config.action_mailer.delivery_method = :smtp\
        config.action_mailer.smtp_settings = { address: ENV.fetch("SMTP_HOST", "localhost"), port: ENV.fetch("SMTP_PORT", "1025").to_i }' config/environments/development.rb &&
      grep -q "delivery_method = :smtp" config/environments/development.rb
  tailwind:
    description: Tailwind CSS, rebuilt by a css process
    default: true
    generate_flags: --css=tailwind
    procfile: ["css: bin/rails tailwindcss:watch"]
  action_text:
    description: Action Text rich text editing (Trix)
    after_generate: bin/rails action_text:install
  storage_s3:
    description: Active Storage on the project's SeaweedFS (S3) instead of local disk
    services: [s3]
    env:
      - AWS_ENDPOINT=http://s3:8333
      - AWS_ACCESS_KEY_ID=neptuno
      - AWS_SECRET_ACCESS_KEY=neptuno
      - S3_BUCKET={{.Name}}-development
    after_generate: |-
      bundle add aws-sdk-s3 --require=false &&
      printf '%s\n' '' 'seaweedfs:' '  service: S3' '  endpoint: <%= ENV["AWS_ENDPOINT"] %>' '  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>' '  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>' '  region: us-east-1' '  bucket: <%= ENV["S3_BUCKET"] %>' '  force_path_style: true' >> config/storage.yml &&
      sed -i 's/config.active_storage.service = :local/config.active_storage.service = :seaweedfs/' config/environments/development.rb
  playwright:
    description: System tests drive the project's shared Playwright browsers (capybara-playwright-driver)
    services: [playwright]
    # The browsers run in the playwright container and reach the app under
    # test by the repo's compose name.
    env: ["SYSTEM_TESTS_HOST={{.Name}}"]
    # playwright-ruby-client must match the minor version of Playwright the
    # playwright service runs.
    after_generate: |-
      bundle add playwright-ruby-client --version '~> 1.65.0' --group test &&
      bundle add capybara-playwright-driver --group test &&
      mkdir -p test && cat > test/application_system_test_case.rb <<'RUBY'
      require "test_helper"
      require "capybara/playwright"

      # System tests drive Chromium in the project's shared playwright
      # container, through its server at PLAYWRIGHT_SERVER_URL. The app under
      # test listens on every interface of this container, and the browser
      # reaches it by the repo's compose name, SYSTEM_TESTS_HOST.
      #
      # The browser also sends every request through SystemTestsProxy below,
      # which hands it to the app under test whatever its host. So tests can
      # visit subdomains and custom domains that no DNS knows, such as
      # visit "http://acme.example.com/" (Capybara adds the port). Requests to
      # outside sites reach the app too; SYSTEM_TESTS_PROXY picks:
      #   on (default)  send every host to the app, except those in
      #                 SYSTEM_TESTS_PROXY_BYPASS, a comma-separated list such
      #                 as "*.googleapis.com,cdn.example.net", which go direct
      #   off           no proxy: only SYSTEM_TESTS_HOST reaches the app
      SYSTEM_TESTS_HOST = ENV.fetch("SYSTEM_TESTS_HOST") { Socket.gethostname }

      # Chromium's HTTP proxy, run in this test process. Plain requests come
      # with the whole URL, which Puma takes as is, and CONNECT, which
      # Chromium uses for WebSockets such as Action Cable's, gets a tunnel to
      # the app. HTTPS through it fails, so bypass the outside sites tests use.
      class SystemTestsProxy
        attr_reader :port

        def initialize(app_port)
          @app_port = app_port
          @server = TCPServer.new("0.0.0.0", 0)
          @port = @server.addr[1]
          Thread.new { loop { Thread.new(@server.accept) { |client| tunnel(client) } } }
        end

        private
          def tunnel(client)
            head = +""
            head << client.readpartial(16_384) until head.include?("\r\n\r\n")
            if head.start_with?("CONNECT ")
              client.write("HTTP/1.1 200 Connection established\r\n\r\n")
              head = head.split("\r\n\r\n", 2).last
            end
            app = TCPSocket.new("127.0.0.1", @app_port)
            app.write(head)
            [[client, app], [app, client]].map { |from, to|
              Thread.new { IO.copy_stream(from, to) rescue nil; to.close_write rescue nil }
            }.each(&:join)
          rescue IOError, SystemCallError
          ensure
            client.close rescue nil
            app&.close rescue nil
          end
      end

      # Capybara makes the driver before it starts the app's server, in each
      # parallel test process, so the port picked here is the one it uses.
      Capybara.register_driver(:playwright_server) do |app|
        url = URI(ENV.fetch("PLAYWRIGHT_SERVER_URL"))
        unless ENV.fetch("SYSTEM_TESTS_PROXY", "on").casecmp?("off")
          Capybara.server_port ||= TCPServer.new("0.0.0.0", 0).then { |s| s.addr[1].tap { s.close } }
          proxy = { server: "http://#{SYSTEM_TESTS_HOST}:#{SystemTestsProxy.new(Capybara.server_port).port}" }
          bypass = ENV["SYSTEM_TESTS_PROXY_BYPASS"].to_s.strip
          proxy[:bypass] = bypass unless bypass.empty?
          # The playwright server launches the browser with these options.
          url.query = URI.encode_www_form(URI.decode_www_form(url.query.to_s) << ["launch-options", { proxy: }.to_json])
        end
        Capybara::Playwright::Driver.new(app,
          browser_server_endpoint_url: url.to_s,
          browser_type: :chromium,
          headless: true)
      end
      Capybara.server_host = "0.0.0.0"
      Capybara.app_host = "http://#{SYSTEM_TESTS_HOST}"
      Capybara.always_include_port = true

      class ApplicationSystemTestCase < ActionDispatch::SystemTestCase
        driven_by :playwright_server

        # Playwright traces record each test's browser actions, with
        # screenshots, the DOM and network calls, to step through in
        # Playwright's Trace Viewer: the Neptuno dashboard's Traces list opens
        # them. Each test's goes to tmp/playwright-traces/<test>.zip, next to a
        # .json that says how the test went. PLAYWRIGHT_TRACE picks which:
        #   failed (default)  keep the traces of tests that fail, and of tests
        #                     declared with trace: true
        #   all               keep every test's trace
        #   off               record none
        # test "checkout", trace: true do ... end keeps that test's trace even
        # when it passes.
        TRACES_DIR = Rails.root.join("tmp/playwright-traces")

        def self.test(name, trace: false, &block)
          super(name, &block).tap { |method| (@traced_tests ||= Set.new) << method.to_s if trace }
        end

        def self.traced_test?(method)
          ancestors.any? { |klass| klass.instance_variable_get(:@traced_tests)&.include?(method) }
        end

        setup do
          @playwright_trace = nil
          if playwright_trace_mode != "off" && page.driver.respond_to?(:start_tracing)
            page.driver.start_tracing(title: "#{self.class.name}##{name}", screenshots: true, snapshots: true, sources: true)
            @playwright_trace = Process.clock_gettime(Process::CLOCK_MONOTONIC)
          end
        end

        # Teardown blocks run after Capybara has closed the browser, so the
        # trace is saved before then.
        def before_teardown
          save_playwright_trace if @playwright_trace
        ensure
          super
        end

        private
          def playwright_trace_mode
            ENV.fetch("PLAYWRIGHT_TRACE", "failed").downcase
          end

          def save_playwright_trace
            result = if skipped? then "skipped" elsif passed? then "passed" elsif error? then "error" else "failed" end
            base = TRACES_DIR.join("#{self.class.name}##{name}".gsub(/[^A-Za-z0-9_.-]+/, "_")[0, 200])
            zip, json = Pathname("#{base}.zip"), Pathname("#{base}.json")
            unless playwright_trace_mode == "all" || self.class.traced_test?(name) || %w[failed error].include?(result)
              # Discard it, and an earlier failure's trace of this test.
              page.driver.stop_tracing
              FileUtils.rm_f([zip, json])
              return
            end
            FileUtils.mkdir_p(TRACES_DIR)
            page.driver.stop_tracing(path: zip.to_s)
            file, line = method(name).source_location
            File.write(json, JSON.pretty_generate(
              test: "#{self.class.name}##{name}",
              result: result,
              location: "#{Pathname(file).relative_path_from(Rails.root)}:#{line}",
              finished_at: Time.now.utc.iso8601,
              duration: (Process.clock_gettime(Process::CLOCK_MONOTONIC) - @playwright_trace).round(2),
              trace: zip.basename.to_s,
              failure: failure&.message.to_s.lines.first(5).join.strip.presence
            ))
          rescue => e
            warn "Could not save the Playwright trace of #{name}: #{e.class}: #{e.message}"
          end
      end
      RUBY
      test -s test/application_system_test_case.rb
